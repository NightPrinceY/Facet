[package]
name = "facet"
version = "0.2.3"
description = "Facet: keep several Claude accounts apart on one computer. Unofficial, not affiliated with Anthropic."
authors = ["Yahya Alnwsany"]
# License not chosen yet (open core, D-005); not published.
publish = false
edition = "2021"
rust-version = "1.90"

[lib]
name = "facet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
# Pinned to releases at least two weeks old (supply-chain rule in SECURITY-COMPLIANCE.md).
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
