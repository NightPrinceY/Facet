<title>Switchyard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a real desktop-app window (sidebar + workspace) under a slim product header; second tab is the written blueprint.
   Concept: a rail switchyard — every account is a track, links and folders are switched onto the right one. */
:root{
  --bg:#E6EBF0; --win:#F8FAFC; --side:#EDF1F5; --panel:#FFFFFF; --sunk:#F1F4F7;
  --line:#D3DBE3; --line2:#E3E8EE;
  --ink:#13202B; --ink2:#475665; --ink3:#748391;
  --accent:#D88A0E; --accent-ink:#8F5800; --accent-soft:#FBEBCF; --on-accent:#1A1204;
  --ok:#1D8A57; --ok-soft:#DDF3E8; --warn:#A86A06; --warn-soft:#FBEED3; --bad:#BF3A2E; --bad-soft:#F9E1DE;
  --p1:#128585; --p2:#6A4DD6; --p3:#C9476F; --p4:#2C78C9; --p5:#5C8A16; --p6:#B4561A;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 12px 40px -12px rgba(19,32,43,.22);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --win:#121A22; --side:#0F161D; --panel:#18222C; --sunk:#141D26;
  --line:#26323E; --line2:#1F2A35;
  --ink:#E5ECF2; --ink2:#A6B3BF; --ink3:#71808D;
  --accent:#F2A53B; --accent-ink:#F7BE6A; --accent-soft:#3A2A10; --on-accent:#1A1204;
  --ok:#3BC985; --ok-soft:#12301F; --warn:#E8B24C; --warn-soft:#33270F; --bad:#F06B5D; --bad-soft:#3A1915;
  --p1:#2EC2BE; --p2:#9B83FF; --p3:#F07399; --p4:#5BA6F5; --p5:#93C445; --p6:#EE8A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --win:#121A22; --side:#0F161D; --panel:#18222C; --sunk:#141D26;
  --line:#26323E; --line2:#1F2A35;
  --ink:#E5ECF2; --ink2:#A6B3BF; --ink3:#71808D;
  --accent:#F2A53B; --accent-ink:#F7BE6A; --accent-soft:#3A2A10; --on-accent:#1A1204;
  --ok:#3BC985; --ok-soft:#12301F; --warn:#E8B24C; --warn-soft:#33270F; --bad:#F06B5D; --bad-soft:#3A1915;
  --p1:#2EC2BE; --p2:#9B83FF; --p3:#F07399; --p4:#5BA6F5; --p5:#93C445; --p6:#EE8A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px -14px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}

/* ---------- product header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--ink2);text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--win)}
.disclaimer{font-size:12px;color:var(--ink3)}

/* ---------- window ---------- */
.window{position:relative;background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr;height:780px}
.chrome{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--side);font-size:13px;color:var(--ink2);user-select:none}
.chrome .ttl{flex:1;text-align:center;font-weight:600;color:var(--ink)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.gnome{display:flex;gap:8px}.gnome i{width:22px;height:22px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--ink2)}
.winctl{display:flex;margin-right:-12px;align-self:stretch}.winctl i{width:44px;display:grid;place-items:center;font-style:normal;color:var(--ink2)}
.chrome.windows .ttl{text-align:left}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}
.side{background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow:auto}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:start;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap}
.nav svg{flex:none;opacity:.8}
.nav:hover{background:var(--line2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-inline-start:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav .cnt.alert{color:var(--bad);font-weight:600}
.sidefoot{margin-top:auto;padding:12px 10px 2px;display:grid;gap:8px;font-size:12px;color:var(--ink3)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel);color:var(--ink2)}
.palbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;color:var(--ink3);text-align:start}
.palbtn span{flex:1}
.main{overflow:auto;padding:24px 28px 40px;min-width:0;position:relative}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.vh h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.015em;margin:0}
.vh p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ex{border-style:dashed;background:none;color:var(--ink3)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--ink3)}
.sec{display:grid;gap:12px;margin-top:22px}
.sec>h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
.hint{font-size:12px;color:var(--ink3)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:16px}
.strip>div{padding:12px 16px;display:grid;gap:2px;min-width:0}
.strip>div+div{border-inline-start:1px solid var(--line2)}
.strip b{font-weight:600}
.strip small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}

/* profile cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.pcard.on{box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 40%,transparent)}
.ph{display:flex;gap:12px;align-items:center;min-width:0}
.mono-badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;color:#fff;background:var(--pc);flex:none;position:relative}
.mono-badge.sm{width:24px;height:24px;border-radius:7px;font-size:11px}
.mono-badge .live{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.ph .who{min-width:0;flex:1}
.ph .who b{display:block;font-size:15px}
.ph .who span{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.meter{display:grid;gap:5px}
.meter .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line2)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pc,var(--accent));transition:width .6s ease}
.bar i.hot{background:var(--bad)}
.surf{display:flex;flex-wrap:wrap;gap:6px}
.surf span{font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--ink2);background:var(--sunk);border-radius:6px;padding:3px 8px}
.surf span.off{opacity:.55;text-decoration:line-through}
.pf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line2);padding-top:12px}
.pf .sp{flex:1}
.confirm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--bad)}

/* list rows */
.rows{display:grid}
.rowi{display:grid;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line2)}
.rowi:first-child{border-top:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:start;padding:10px 14px;border-top:1px solid var(--line2);vertical-align:middle}
thead th{border-top:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600;background:var(--sunk)}
td.c,th.c{text-align:center}

/* toggles */
.tog{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--ok)}
.tog[aria-checked="true"]::after{transform:translateX(14px)}
[dir="rtl"] .tog[aria-checked="true"]::after{transform:translateX(-14px)}
.cell{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:inline-grid;place-items:center}
.cell[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}

/* inputs */
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--ink2)}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow .inp{flex:1 1 240px}
.result{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--sunk);border:1px dashed var(--line);font-size:13px}
code.cmd{font-family:var(--f-mono);font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 7px;overflow-wrap:anywhere}

/* router diagram */
.yard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 0;overflow-x:auto}
.yard svg{display:block;width:100%;min-width:560px;height:auto}
.trk{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round}
.trk.tie{stroke:var(--line2);stroke-width:11;stroke-dasharray:2 9}
.trk.lit{stroke:var(--pc);}
.yard text{fill:var(--ink2);font-family:var(--f-body);font-size:13px}
.yard .lbl{fill:var(--ink);font-weight:600}
.yard .sub{fill:var(--ink3);font-size:11px}
.lever{fill:var(--panel);stroke:var(--ink3);stroke-width:2}
.train{fill:var(--accent)}
.ask{position:absolute;inset:0;background:color-mix(in srgb,var(--win) 70%,transparent);display:grid;place-items:center;z-index:30;backdrop-filter:blur(2px)}
.askbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;width:min(380px,calc(100% - 32px));display:grid;gap:12px}
.askbox h4{margin:0;font-size:15px}
.askbox .opts{display:grid;gap:6px}
.askbox .opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:8px 10px;text-align:start}
.askbox .opt:hover{border-color:var(--pc)}

/* chart */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.chart .ax{fill:var(--ink3);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);padding:4px 2px 6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--pc)}

/* palette, modal, toasts */
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 28%,transparent);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:70px 16px 16px}
.pal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--line);width:100%;padding:14px 16px;font-size:15px;background:none;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.pal li[aria-selected="true"]{background:var(--accent-soft)}
.pal li .k{margin-inline-start:auto;font-size:11px;color:var(--ink3)}
.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;max-height:calc(100% - 20px);overflow:auto}
.modal header,.modal footer{padding:16px 18px;display:flex;align-items:center;gap:10px}
.modal header{border-bottom:1px solid var(--line2)}
.modal header h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px;flex:1}
.modal footer{border-top:1px solid var(--line2);justify-content:flex-end}
.modal .body{padding:18px;display:grid;gap:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;background:var(--pc)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.checks input{margin-top:3px;accent-color:var(--accent)}
.preview{background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:grid;gap:7px;font-size:12.5px}
.preview div{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.preview span:first-child{color:var(--ink3)}
.toasts{position:absolute;inset-inline-end:16px;bottom:16px;display:grid;gap:8px;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--win);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);animation:tin .25s ease both;max-width:380px}
.toast code{font-family:var(--f-mono);font-size:11.5px;opacity:.85}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:grid;min-width:190px}
.menu button{border:0;background:none;text-align:start;padding:7px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--sunk)}

/* doctor */
.chk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line2)}
.chk:first-child{border-top:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--ink3)}
.chk .ic.ok{background:var(--ok)}.chk .ic.warn{background:var(--warn)}.chk .ic.bad{background:var(--bad)}
.chk .ic.run{background:none;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chk b{display:block;font-weight:600}
.chk p{margin:2px 0 0;color:var(--ink2);font-size:13px}

/* settings */
.set{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line2)}
.set:first-child{border-top:0}
.set b{display:block;font-weight:500}
.set span{font-size:12px;color:var(--ink3)}
.set select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel)}

/* blueprint */
.bp{display:grid;gap:26px}
.bp .lead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px clamp(18px,4vw,36px);display:grid;gap:12px}
.bp h2{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:28ch}
.bp h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.bp p{margin:0;max-width:68ch;color:var(--ink2)}
.bp .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start}
.fact .big{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.02em}
.fact p{font-size:13.5px}
.fact a{color:var(--accent-ink);font-size:12.5px}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.diff div{border-top:2px solid var(--ink);padding-top:10px}
.diff b{display:block;margin-bottom:3px}
.diff p{font-size:13.5px}
.arch{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;overflow-x:auto}
.arch .layer{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:stretch;min-width:600px}
.arch .lname{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding-top:9px}
.arch .boxes{display:flex;flex-wrap:wrap;gap:8px}
.arch .box{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 11px;font-size:13px}
.arch .box.k{border-color:var(--accent);background:var(--accent-soft)}
.arch .box small{display:block;color:var(--ink3);font-size:11px}
.arch .flow{min-width:600px;padding-inline-start:162px;color:var(--ink3);font-size:12px}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}
.phase .n{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink)}
.phase ul{margin:0;padding-inline-start:18px;color:var(--ink2);font-size:13px;display:grid;gap:4px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.rules div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.5px;color:var(--ink2)}
.rules div::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);margin-top:6px}
.src{columns:2;column-gap:28px;font-size:13px;margin:0;padding-inline-start:18px}
.src li{margin-bottom:6px;break-inside:avoid}
.src a{color:var(--accent-ink)}

/* observatory */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:3px;min-width:0}
.kpi small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--ink2)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.crumbs button{border:0;background:none;color:var(--accent-ink);padding:2px 4px;border-radius:5px;font-weight:500}
.crumbs button:last-child{color:var(--ink);cursor:default}
.crumbs i{color:var(--ink3);font-style:normal}
.drill{display:grid}
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.7fr) 80px 70px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
.drow:first-child{border-top:0}
button.drow:hover{background:var(--sunk)}
.drow .bar{height:8px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink3);min-width:520px}
.heat i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--accent) calc(var(--v)*100%),var(--sunk))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

/* bridge */
.live{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line2)}
.live:first-child{border-top:0}
.st{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:500}
.st i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.st.working i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 1.6s ease-in-out infinite}
.st.waiting i{background:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.thread{display:grid;gap:10px}
.msg{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msg .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.msg .reply{border-inline-start:2px solid var(--line);padding-inline-start:10px;color:var(--ink2);font-size:13px}
.msg.blocked{border-color:var(--bad);background:var(--bad-soft)}
.packet{display:flex;flex-wrap:wrap;gap:6px}
textarea.inp{resize:vertical;min-height:70px}

/* RTL tweaks */
[dir="rtl"]{font-family:"Noto Sans Arabic",var(--f-body)}
[dir="rtl"] .vh h2{font-family:"Noto Sans Arabic",var(--f-body);font-weight:600}

@media (max-width:980px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.drow{grid-template-columns:minmax(0,1fr) 70px 60px}.drow .bar{display:none}.live{grid-template-columns:auto minmax(0,1fr)}.live>:nth-child(n+3){grid-column:2}}
@media (max-width:860px){
  .window{height:auto}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}
  .side .grp,.sidefoot{display:none}
  .main{overflow:visible;padding:18px 16px 28px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:minmax(0,1fr)}
  .rules{grid-template-columns:minmax(0,1fr)}
  .src{columns:1}
  .overlay{position:fixed}
  .toasts{position:fixed}
}
@media (max-width:560px){
  .strip{grid-template-columns:minmax(0,1fr)}
  .strip>div+div{border-inline-start:0;border-top:1px solid var(--line2)}
  .phases{grid-template-columns:minmax(0,1fr)}
  .chrome .ttl{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  else if(S.os==="windows") c.innerHTML=`${ttl}<span class="winctl"><i>&#x2013;</i><i>&#x25A2;</i><i>&#x2715;</i></span>`;
  else c.innerHTML=`<span style="width:84px"></span>${ttl}<span class="gnome"><i>&#x2013;</i><i>&#x25A2;</i><i>&#x2715;</i></span>`;
}
const NAV=[["g1",["profiles","usage"]],["g2",["bridge","router","folders"]],["g3",["control","mcp","kit","sessions"]],["g4",["backups","doctor","settings"]]];
function counts(k){
  if(k==="profiles") return S.profiles.length;
  if(k==="mcp"){const b=S.mcp.filter(m=>m.status==="bad").length;return b?`<span class="cnt alert">${b} issue</span>`:S.mcp.length}
  if(k==="sessions") return S.sessions.length;
  if(k==="bridge"){const w=S.live.filter(l=>l.state==="waiting").length;return w?`<span class="cnt alert">${w} waiting</span>`:S.live.length}
  if(k==="doctor") return S.doctorRan?"":'<span class="cnt alert">2</span>';
  return "";
}
function renderSide(){
  const run=S.profiles.filter(p=>p.running).length;
  $("#side").innerHTML=NAV.map(([g,items])=>`<div class="grp">${t(g)}</div>`+items.map(k=>{
    const c=counts(k); const cnt=typeof c==="string"&&c.startsWith("<")?c:(c!==""?`<span class="cnt">${c}</span>`:"");
    return `<button class="nav" data-nav="${k}" ${S.view===k?'aria-current="page"':""}>${ic(k==="profiles"?"profiles":k)}<span>${t(k)}</span>${cnt}</button>`}).join("")).join("")+
  `<div class="sidefoot"><button class="palbtn" id="openPal">${ic("search",14)}<span>${t("search")}</span><span class="kbd">${OS[S.os].mod} K</span></button>
   <div class="num">${run} / ${S.profiles.length} ${t("running")} · v0.1 concept</div></div>`;
}

/* ---------------- views ---------------- */
const fmtLeft=ms=>{if(ms==null)return "no active window";const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${String(m).padStart(2,"0")}m`:`${m}m ${String(x).padStart(2,"0")}s`};
function meter(label,val,right){return `<div class="meter"><div class="row"><span>${label}</span><span class="num">${right}</span></div><div class="bar"><i class="${val>=S.settings.threshold?"hot":""}" style="width:${val}%"></i></div></div>`}
function headroom(){return [...S.profiles].sort((a,b)=>a.session-b.session)[0]}

const V={};

  const run=S.profiles.filter(p=>p.running).length, hr=headroom();

  <div class="strip">
    <div><small>Running</small><b class="num">${run} of ${S.profiles.length} profiles</b></div>

    <div class="pf">
      ${S.confirmRemove===p.id?`<div class="confirm">Remove ${esc(p.name)}? Its data folder is kept.<button class="btn sm danger" data-act="remove" data-id="${p.id}">Remove</button><button class="btn sm" data-act="cancelrm">Keep</button></div>`:
      `${p.running?`<button class="btn pri sm" data-act="focus" data-id="${p.id}">Show window</button><button class="btn sm" data-act="quit" data-id="${p.id}">Quit</button>`:`<button class="btn pri sm" data-act="launch" data-id="${p.id}">${ic("play",12)} Launch</button>`}
      <button class="btn sm" data-act="term" data-id="${p.id}" ${p.cli?"":"disabled"}>${ic("term",13)} Terminal</button>
      <span class="sp"></span><span class="hint mono" title="${esc(o.dir(p))}">${esc(o.dir(p))}</span>`}

V.usage=()=>{
  const O=S.obs, mult={"24h":.16,"7d":1,"30d":3.8}[O.range];
  const fT=v=>{v*=mult;return v>=1?v.toFixed(1)+"M":Math.round(v*1000)+"K"}, fC=v=>"$"+(v*mult).toFixed(2);
  const accTot=id=>(O.tree[id]||[]).reduce((a,pr)=>{pr.sessions.forEach(s=>{a.tok+=s.tok;a.cost+=s.cost});return a},{tok:0,cost:0});
  const all=S.profiles.reduce((a,p)=>{const x=accTot(p.id);a.tok+=x.tok;a.cost+=x.cost;return a},{tok:0,cost:0});
  const sessN=S.profiles.reduce((n,p)=>n+(O.tree[p.id]||[]).reduce((m,pr)=>m+pr.sessions.length,0),0);
  const types=[["Cache read",.84,"var(--p4)"],["Cache write",.08,"var(--p1)"],["Input",.045,"var(--p2)"],["Output",.035,"var(--accent)"]];

  /* drill-down */
  const [pa,pj,ss]=O.path; let crumbs=[["All accounts",0]], rows="", detail="";
  const row=(label,sub,tok,cost,max,pc,go)=>`<${go?"button":"div"} class="drow" ${go?`data-drill='${esc(JSON.stringify(go))}'`:""} style="--pc:${pc}">
     <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</b><span class="hint">${sub}</span></div>
     <div class="bar"><i style="width:${Math.max(2,tok/max*100)}%"></i></div><span class="num" style="text-align:end">${fT(tok)}</span><span class="num muted" style="text-align:end">${fC(cost)}</span></${go?"button":"div"}>`;
  if(!pa){
    const t=S.profiles.map(p=>({p,...accTot(p.id)})), max=Math.max(...t.map(x=>x.tok),.01);
    rows=t.map(x=>row(x.p.name,`${(O.tree[x.p.id]||[]).length} projects · ${esc(x.p.plan)}`,x.tok,x.cost,max,`var(--${x.p.pc})`,[x.p.id])).join("");
  }else{
    const p=P(pa); crumbs.push([p?p.name:pa,1]);
    const projs=O.tree[pa]||[];
    if(pj==null){
      const t=projs.map((pr,i)=>({pr,i,tok:pr.sessions.reduce((a,s)=>a+s.tok,0),cost:pr.sessions.reduce((a,s)=>a+s.cost,0)})), max=Math.max(...t.map(x=>x.tok),.01);
      rows=t.length?t.map(x=>row(x.pr.name,`${x.pr.sessions.length} sessions`,x.tok,x.cost,max,`var(--${p.pc})`,[pa,x.i])).join(""):`<div class="drow"><span class="muted">No Claude Code activity yet.</span></div>`;
    }else{
      const pr=projs[pj]; crumbs.push([pr.name,2]);
      if(ss==null){
        const max=Math.max(...pr.sessions.map(s=>s.tok),.01);
        rows=pr.sessions.map((s,i)=>row(s.t,esc(s.model),s.tok,s.cost,max,`var(--${p.pc})`,[pa,pj,i])).join("");
      }else{
        const s=pr.sessions[ss]; crumbs.push([s.t,3]);
        const cats=[["File reads",.34],["Tool output",.27],["System, skills, CLAUDE.md",.18],["Claude’s replies",.12],["Subagents",.06],["Your messages",.03]];
        const calls=[["Bash · npm test (full output)",.071],["Read · src/checkout/cart.ts",.034],["Grep · “retry” across repo",.022],["Read · package-lock.json",.019],["Subagent · code reviewer",.016]];
        const max=cats[0][1];
        rows=cats.map(c=>row(c[0],`${Math.round(c[1]*100)}% of this session`,s.tok*c[1],s.cost*c[1],max,`var(--${p.pc})`,null)).join("");
        detail=`<div class="sec"><h3>Heaviest single calls</h3><div class="panel rows">${calls.map(c=>`<div class="rowi" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="mono" style="overflow-wrap:anywhere">${esc(c[0])}</span><span class="num">${fT(s.tok*c[1])}</span><span class="num muted">${fC(s.cost*c[1])}</span></div>`).join("")}</div>
          <div class="result"><b>Tip</b><span>Test output is 7% of this session. Piping <code class="cmd">npm test</code> through a summary hook would save about ${fT(s.tok*.06)} next time.</span></div></div>`;
      }
    }
  }
  const crumbHtml=crumbs.map((c,i)=>`${i?"<i>›</i>":""}<button data-crumb="${c[1]}">${esc(c[0])}</button>`).join("");

  /* heatmap (deterministic sample) */
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let heat='<span></span>'+Array.from({length:24},(_,h)=>`<span style="text-align:center">${h%6===0?h:""}</span>`).join("");
  days.forEach((d,di)=>{heat+=`<span>${d}</span>`;for(let h=0;h<24;h++){const work=h>=9&&h<=18&&di<5,eve=h>=20&&h<=23;let v=(work?.45:eve?.35:.04)+rnd()*.5;if(h<7)v*=.15;if(di>=5)v*=work?.4:1.1;v=Math.min(1,v);heat+=`<i style="--v:${v.toFixed(2)}" title="${d} ${h}:00"></i>`}});

  const fc=S.profiles.filter(p=>p.weekly).map(p=>{const proj=Math.min(130,Math.round(p.weekly*1.9));return `<div class="rowi" style="grid-template-columns:auto minmax(0,1fr) auto;--pc:var(--${p.pc})">${badge(p,1)}<div><b>${esc(p.name)}</b><div class="hint">${p.weekly}% used now · at this pace about ${proj}% by the weekly reset</div></div>${proj>=100?'<span class="pill bad">Hits limit Thu 14:00</span>':proj>=80?'<span class="pill warn">Close</span>':'<span class="pill ok">Fine</span>'}</div>`}).join("");

  return `<div class="vh"><div><h2>${t("usage")}</h2><p>Every token, on every layer: account, project, session, down to the single tool call that cost the most.</p></div>
    <div class="inrow" style="align-items:center"><span class="pill ex">sample data</span><div class="seg">${["24h","7d","30d"].map(r=>`<button data-range="${r}" aria-pressed="${O.range===r}">${r}</button>`).join("")}</div></div></div>
  <div class="kpis">
    <div class="kpi"><small>Tokens</small><b class="num">${fT(all.tok)}</b><span>${sessN} sessions, ${S.profiles.length} accounts</span></div>
    <div class="kpi"><small>API-equivalent cost</small><b class="num">${fC(all.cost)}</b><span>What this would cost on the API</span></div>
    <div class="kpi"><small>Cache hit rate</small><b class="num">91%</b><span>Higher means cheaper turns</span></div>
    <div class="kpi"><small>Plan value</small><b class="num">${(all.cost*mult/ (O.range==="30d"?340:O.range==="7d"?79:11)).toFixed(1)}×</b><span>Usage value per dollar of your plans</span></div>
  </div>
  <div class="sec"><h3>Where the tokens went</h3>
    <div class="crumbs">${crumbHtml}</div>
    <div class="panel drill">${rows}</div>${detail}</div>
  <div class="two sec">
    <div class="panel" style="padding:14px 16px;display:grid;gap:10px"><b>Token types</b><div class="split">${types.map(x=>`<i style="width:${x[1]*100}%;background:${x[2]}" title="${x[0]}"></i>`).join("")}</div>
      <div class="legend">${types.map(x=>`<span><i style="background:${x[2]}"></i>${x[0]} ${Math.round(x[1]*1000)/10}%</span>`).join("")}</div>
      <p class="hint" style="margin:0">Counts are de-duplicated. Some tools count cached context twice and show 2–3× too many tokens.</p></div>
    <div class="panel" style="padding:14px 16px;display:grid;gap:10px"><b>Models</b><div class="split"><i style="width:68%;background:var(--p2)"></i><i style="width:27%;background:var(--p1)"></i><i style="width:5%;background:var(--p5)"></i></div>
      <div class="legend"><span><i style="background:var(--p2)"></i>Opus 5.5 · 68%</span><span><i style="background:var(--p1)"></i>Sonnet 5.5 · 27%</span><span><i style="background:var(--p5)"></i>Haiku 4.5 · 5%</span></div>
      <p class="hint" style="margin:0">Moving the 3 lightest sessions to Sonnet would have used about 40% fewer tokens on them.</p></div>
  </div>
  <div class="sec"><h3>When you work</h3><div class="panel" style="padding:14px;overflow-x:auto"><div class="heat">${heat}</div></div></div>
  <div class="two sec">
    <div><h3 style="margin:0 0 10px;font-size:13px">Weekly forecast</h3><div class="panel rows">${fc}</div></div>
    <div><h3 style="margin:0 0 10px;font-size:13px">Client budgets</h3><div class="panel rows">${O.budgets.map(b=>{const p=P(b.p),pct=Math.round(b.used/b.limit*100);return `<div class="rowi" style="grid-template-columns:minmax(0,1fr) auto;--pc:var(--${p?p.pc:"p1"})"><div style="display:grid;gap:6px"><span><b class="mono">${esc(b.proj)}</b></span><div class="bar"><i class="${pct>=S.settings.threshold?"hot":""}" style="width:${pct}%"></i></div><span class="hint num">$${b.used.toFixed(2)} of $${b.limit} · ${pct}%</span></div><button class="btn sm" data-act="invoice" data-proj="${esc(b.proj)}">Export</button></div>`}).join("")}</div></div>
  </div>
  <div class="sec"><h3>Alerts</h3><div class="panel">
   <div class="set"><div><b>Warn me at <span class="num" id="thv">${S.settings.threshold}</span>% of a limit or budget</b><span>Bars turn red past this point</span></div><input type="range" min="50" max="95" step="5" value="${S.settings.threshold}" id="th" aria-label="Warning threshold" style="accent-color:var(--accent)"></div>
   <div class="set"><div><b>Weekly report</b><span>A Monday summary of tokens, cost and trends per account</span></div><button class="tog" role="switch" aria-checked="${S.settings.suggest}" data-set="suggest" aria-label="Weekly report"></button></div>
  </div>
  <p class="hint" style="margin-top:8px">Sources: each profile’s local Claude Code session logs, plus an optional built-in OpenTelemetry receiver that Claude Code can report to. Nothing leaves your computer.</p></div>`;
};

V.bridge=()=>{
  const L=id=>S.live.find(l=>l.id===id), br=S.br;
  const opt=sel=>S.live.map(l=>{const p=P(l.p);return `<option value="${l.id}" ${sel===l.id?"selected":""}>${esc(p?p.name:"?")} · ${esc(l.project)}</option>`}).join("");
  const walled=id=>{const l=L(id);return l&&S.walls[l.p]};
  const tag=l=>{const p=P(l.p);return p?`<span class="pill" style="gap:7px">${badge(p,1)}${esc(p.name)} <span class="mono muted">${esc(l.project)}</span></span>`:""};
  return `<div class="vh"><div><h2>${t("bridge")}</h2><p>Every running Claude session, across all your accounts, in one place. Let them ask each other questions, share snippets, or hand a task over, with you approving what crosses.</p></div></div>
  <div class="panel">${S.live.map(l=>{const p=P(l.p);if(!p)return "";return `<div class="live" style="--pc:var(--${p.pc})">${badge(p,1)}
     <div style="min-width:0"><b>${esc(l.task)}</b><div class="hint"><span class="mono">${esc(l.project)}</span> · ${esc(p.name)} · ${l.tok} tokens</div></div>
     <span class="st ${l.state}"><i></i>${l.state==="working"?"Working":l.state==="waiting"?"Needs you":"Idle"}</span>
     <div class="inrow" style="gap:6px;justify-content:flex-end">${S.walls[l.p]?'<span class="pill">Walled off</span>':`<button class="btn sm" data-msgfrom="${l.id}">Message</button>`}<button class="btn sm ${l.state==="waiting"?"pri":""}" data-act="jump" data-l="${l.id}">${l.state==="waiting"?"Answer":"Open"}</button></div></div>`}).join("")}</div>

  <div class="two sec" style="align-items:start">
   <div class="panel" style="padding:16px;display:grid;gap:12px">
    <b>New message</b>
    <div class="inrow"><div class="field" style="flex:1 1 180px"><label for="brFrom">From</label><select class="inp" id="brFrom">${opt(br.from)}</select></div>
      <div class="field" style="flex:1 1 180px"><label for="brTo">To</label><select class="inp" id="brTo">${opt(br.to)}</select></div></div>
    <div class="seg" role="group" aria-label="Kind">${["Question","Snippet","Hand off"].map(k=>`<button data-kind="${k}" aria-pressed="${br.kind===k}">${k}</button>`).join("")}</div>
    <textarea class="inp" id="brText" placeholder="${br.kind==="Hand off"?"What should the other session take over?":br.kind==="Snippet"?"Paste or describe what to share":"Ask the other session something"}">${br.kind==="Hand off"?"Take over the contact form: finish validation and add the tests.":br.kind==="Question"?"How did you set up retries for the payment API?":""}</textarea>
    ${br.kind==="Hand off"?`<div class="field"><label>Handoff packet</label><div class="packet">${[["summary","Conversation summary"],["files","Changed files"],["diff","Git diff"],["todos","Open to-dos"],["error","Last error"]].map(([k,l])=>`<button class="pill" data-pk="${k}" aria-pressed="${br.packet[k]}" style="${br.packet[k]?"background:var(--ink);color:var(--win);border-color:transparent":""}">${br.packet[k]?"✓ ":""}${l}</button>`).join("")}</div>
      <span class="hint">The packet is shown to you before it is sent. Secrets are stripped from diffs and errors.</span></div>`:""}
    ${walled(br.from)||walled(br.to)?`<div class="result" style="border-color:var(--bad);background:var(--bad-soft);color:var(--bad)">Client Lab is walled off. Nothing can be sent to or from it until you lift the wall below.</div>`:""}
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn pri" data-act="send" ${br.from===br.to?"disabled":""}>Send to ${esc((P((L(br.to)||{}).p)||{}).name||"…")}</button></div>
   </div>
   <div style="display:grid;gap:10px"><b style="font-size:13px">Recent</b><div class="thread" id="thread">${S.relays.map(r=>{const a=L(r.from),b=L(r.to);return `<div class="msg ${r.blocked?"blocked":""}"><div class="meta">${a?tag(a):""}<span>→</span>${b?tag(b):""}<span class="pill">${esc(r.kind)}</span><span>${esc(r.t)}</span></div><div>${esc(r.text)}</div>${r.reply?`<div class="reply">${esc(r.reply)}</div>`:""}</div>`}).join("")}</div></div>

};

    <circle cx="56" cy="130" r="16" fill="var(--ink)"/><text x="56" y="134" text-anchor="middle" style="fill:var(--win);font-size:11px;font-weight:600">link</text>
    <circle cx="250" cy="130" r="9" class="lever"/><text x="250" y="160" text-anchor="middle" class="sub">rules</text>
    ${S.profiles.map((p,i)=>`<g><circle cx="596" cy="${ys[i]}" r="11" fill="var(--${p.pc})"/><text x="616" y="${ys[i]+1}" class="lbl">${esc(p.name)}</text><text x="616" y="${ys[i]+15}" class="sub">${p.running?"running":"starts on demand"}</text></g>`).join("")}
    <circle r="7" class="train" id="train" cx="56" cy="130" opacity="0"/>
  </svg></div>
  <div class="sec"><h3>Try a link</h3>
   <div class="inrow"><input class="inp mono" id="linkIn" value="claude://claude.ai/new?surface=chat" aria-label="claude link"><button class="btn pri" data-act="route">Route it</button></div>

function matchFolder(path){
  const home=S.os==="windows"?"%USERPROFILE%":"~";
  const norm=path.trim().replace(/\\/g,"/").replace(/^%USERPROFILE%/i,"~").replace(/\/+$/,"");
  for(const r of S.folders){
    const rx=new RegExp("^"+r.glob.replace(/[.+^${}()|[\]]/g,"\\$&").replace(/\*\*/g,"\u0000").replace(/\*/g,"[^/]*").replace(/\u0000/g,".*").replace(/\/\.\*$/,"(/.*)?")+"$");
    if(rx.test(norm)) return {r,home};
  }
  return null;
}
function updatePath(){
  const out=$("#pathOut"); if(!out) return;
  const m=matchFolder($("#pathIn").value); const p=m&&P(m.r.to);
  out.innerHTML=p?`Runs as ${routeTo(p.id)} <span class="muted">matched</span> <code class="cmd">${esc(m.r.glob)}</code><span style="flex-basis:100%"></span><code class="cmd">${S.os==="windows"?`set CLAUDE_CONFIG_DIR=${OS.windows.cli(p)} &amp;&amp; claude`:`CLAUDE_CONFIG_DIR=${esc(OS[S.os].cli(p))} claude`}</code>`:"No rule matches. Add a catch-all rule (**).";
}

  if(S.view==="control"){const c=S.ctl[S.ctlP];[["ctlModel","model"],["ctlStyle","style"],["ctlMode","mode"]].forEach(([id,k])=>$("#"+id).addEventListener("change",e=>{c[k]=e.target.value;c.dirty=true;render()}))}

  const len=path.getTotalLength();train.setAttribute("opacity","1");
  const finish=()=>{path.classList.add("lit");const e=path.getPointAtLength(len);train.setAttribute("cx",e.x);train.setAttribute("cy",e.y);done&&done()};
  if(reduce){finish();return}
  const t0=performance.now(),dur=900;
  (function step(ts){const k=Math.min(1,(ts-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,pt=path.getPointAtLength(e*len);

}

     <div><b>Links land in the right place</b><p>Sign-in callbacks and dock actions reach the account that asked, which no current tool handles.</p></div>
     <div><b>Folders pick the account</b><p>Type claude in ~/work and it runs as Work. Like Git identities, for Claude.</p></div>
     <div><b>Local and careful</b><p>Never touches passwords or sign-in tokens, backs up before every config edit, sends no telemetry.</p></div>
    </div></div>

   <div><span class="eyebrow">Ground rules</span>
    <div class="rules" style="margin-top:12px">
     <div>Never read, copy or upload passwords or sign-in tokens.</div>
     <div>Never modify Claude’s own files. Only launch it with different folders.</div>
     <div>Back up every config before editing it, and only edit while that account is closed.</div>
     <div>Keep platform tricks in versioned adapters, since a Claude update can change window ids or flags.</div>
     <div>Independent name and icon. Say “works with Claude”, never imply it is from Anthropic.</div>
     <div>Open source under a permissive licence, so users can check the claims above.</div>
     <div>Follow Anthropic’s terms. Accounts are for separating real work (personal, employer, clients), not for getting around usage limits.</div>
     <div>The Bridge only sends what you approve. Walled accounts never send or receive.</div>
