<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.lane{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;width:100%;max-width:640px}.lab{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500}.av{width:20px;height:20px;border-radius:6px;background:var(--facet-2)}.tr{position:relative;height:40px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}.pr{position:absolute;top:5px;bottom:5px;width:2px;background:var(--ink)}.dot{position:absolute;top:50%;border-radius:50%;background:var(--facet-2);transform:translate(-50%,-50%)}.tail{position:absolute;top:calc(50% - 2px);height:4px;background:var(--facet-2);opacity:.25}.tool{position:absolute;top:calc(50% + 8px);width:6px;height:6px;background:var(--ink-3);transform:translateX(-50%)}.sel{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);transform:translate(-50%,-50%)}.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}</style>
<div class="wrap"><div class="lane"><div class="lab"><span class="av"></span>Work</div><div class="tr"><span class="pr" style="left:4%"></span><span class="tail" style="left:9%;width:8%"></span><span class="dot" style="left:9%;width:10px;height:10px"></span><span class="tool" style="left:19%"></span><span class="dot" style="left:27%;width:16px;height:16px"></span><span class="sel" style="left:27%"></span><span class="tool" style="left:36%;background:var(--bad)"></span><span class="dot" style="left:44%;width:8px;height:8px"></span><span class="pr" style="left:58%"></span><span class="dot" style="left:64%;width:12px;height:12px"></span><span class="tool" style="left:71%"></span><span class="now" style="left:82%"></span></div></div></div>
<script></script>
