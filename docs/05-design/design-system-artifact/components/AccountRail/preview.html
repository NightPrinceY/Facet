<!-- @dsCard group="Identity" height=250 subtitle="Scope and tint" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.frame{display:flex;gap:16px;align-items:stretch}.rail{width:64px;background:var(--rail);border:1px solid var(--line);border-radius:var(--radius-xl);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}.r{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:0;font:650 15px var(--font-display);cursor:pointer}.r[aria-pressed=true]::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--ink)}.all{background:var(--surface);border:1px solid var(--line);color:var(--ink)}.add{background:none;border:1.5px dashed var(--line);color:var(--ink-3)}hr{width:24px;border:0;border-top:1px solid var(--line);margin:0}.win{flex:1;min-width:180px;border-radius:var(--radius-2xl);background:var(--surface-2);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--tint,transparent);display:grid;place-items:center;color:var(--ink-2);font-size:13px}</style>
<div class="wrap"><div class="frame"><div class="rail" id="rail"><button class="r all" data-c="" aria-pressed="false">&#9638;</button><hr><button class="r" data-c="1" aria-pressed="false" style="background:var(--facet-1);color:var(--on-facet-1)">P</button><button class="r" data-c="2" aria-pressed="true" style="background:var(--facet-2);color:var(--on-facet-2)">W</button><button class="r" data-c="3" aria-pressed="false" style="background:var(--facet-3);color:var(--on-facet-3)">F</button><button class="r add">+</button></div><div class="win" id="win" style="--tint:var(--facet-2)">Window tinted for the selected account</div></div></div>
<script>document.getElementById('rail').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;document.querySelectorAll('[data-c]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});document.getElementById('win').style.setProperty('--tint',b.dataset.c?'var(--facet-'+b.dataset.c+')':'transparent')});</script>
