<!-- @dsCard group="Inputs" height=130 subtitle="Settings row" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row{display:flex;gap:16px;align-items:center;justify-content:space-between;width:100%;max-width:460px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-xl)}.row b{display:block;font-weight:500;font-size:14px}.row span{font-size:12px;color:var(--ink-3)}.t{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}.t::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}.t[aria-checked=true]{background:var(--ink)}.t[aria-checked=true]::after{transform:translateX(14px)}.t:focus-visible{outline:2px solid var(--focus);outline-offset:2px}</style>
<div class="wrap"><div class="row"><div><b>Tint windows Work-coloured</b><span>So you never type into the wrong account</span></div><button class="t" role="switch" aria-checked="true" aria-label="Tint windows"></button></div></div>
<script>document.querySelectorAll('.t').forEach(function(t){t.onclick=function(){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')}});</script>
